name: Agent Review

# Comment-triggered, NOT `pull_request`. A `pull_request` run executes the
# workflow file as it exists on the PR branch, so any collaborator with write
# access could open a same-repo PR that edits this file and exfiltrates a
# secret. `issue_comment` always runs the copy on the default branch, so a
# branch edit changes nothing. Cost: reviews are no longer automatic — comment
# `@agent-review` on the PR. (Branch protection on .github/workflows/ would be
# the other fix; it is GitHub Pro-only on private repos.)
on:
  issue_comment:
    types: [created]

jobs:
  agent-review:
    # Same two gates as agent.yml: AGENT_RUNNER unset means the repo was never
    # configured and nothing should happen at all; the author-association check
    # keeps a stranger from spending someone's subscription.
    if: |
      vars.AGENT_RUNNER != '' &&
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '@agent-review') &&
      contains(fromJSON('["OWNER","COLLABORATOR","MEMBER"]'), github.event.comment.author_association)

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # posting the review IS the point of this job
      issues: write

    env:
      GH_TOKEN: ${{ github.token }}
      # >>> agent-billing: generated by scripts/agent_billing.py — do not hand-edit >>>
      AGENT_TOKEN: ${{ github.actor == '__OWNER_LOGIN__' && secrets.AGENT_TOKEN || '' }}
      # <<< agent-billing <<<

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check the agent is configured
        env:
          TICKET: ${{ github.event.issue.number }}
        run: |
          if [ -z "$AGENT_TOKEN" ]; then
            gh issue comment "$TICKET" --body \
              "No model token is billed to \`${{ github.actor }}\`. Run \`scripts/agent_billing.py add ${{ github.actor }}\`, or set the \`AGENT_TOKEN\` secret."
            exit 1
          fi
          case "${{ vars.AGENT_RUNNER }}" in
            claude|codex|custom) ;;
            *) echo "AGENT_RUNNER must be claude, codex or custom"; exit 1 ;;
          esac

      # Provider-neutral: the review is posted with `gh`, not with a
      # vendor-specific inline-comment MCP tool, so all three runners behave the
      # same. If you only ever use the claude runner and want inline per-line
      # comments, swap this prompt for the code-review plugin — see README.
      - name: Build the prompt
        env:
          TICKET: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          {
            echo 'AGENT_PROMPT<<PROMPT_EOF'
            echo "Review pull request #$TICKET in the GitHub repository $REPO."
            echo ""
            echo "1. Read it: gh pr view $TICKET --comments && gh pr diff $TICKET"
            echo "2. Look for correctness bugs first, then reuse and simplification."
            echo "   Skip style nits. Say so plainly if you find nothing."
            echo "3. Post the review as ONE comment, quoting file:line for each finding:"
            echo "     gh pr review $TICKET --comment --body-file <your file>"
            echo ""
            echo "Review only. Do not edit files, commit, or push."
            echo PROMPT_EOF
          } >> "$GITHUB_ENV"

      - name: Run review (Claude Code)
        if: vars.AGENT_RUNNER == 'claude'
        uses: anthropics/claude-code-action@v1
        with:
          prompt: ${{ env.AGENT_PROMPT }}
          claude_code_oauth_token: ${{ env.AGENT_TOKEN }}
          claude_args: '--allowedTools "Bash,Read,Glob,Grep"'

      - name: Run review (OpenAI Codex)
        if: vars.AGENT_RUNNER == 'codex'
        uses: openai/codex-action@v1
        with:
          prompt: ${{ env.AGENT_PROMPT }}
          openai-api-key: ${{ env.AGENT_TOKEN }}
          # Read-only on the tree, but it still needs network to post via gh.
          sandbox: danger-full-access

      - name: Run review (custom)
        if: vars.AGENT_RUNNER == 'custom'
        run: ${{ vars.AGENT_COMMAND }}
