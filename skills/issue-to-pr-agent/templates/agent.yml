name: Agent

# The `@agent` worker: one ticket -> one branch -> one PR.
#
# Model-independent by design. Nothing below names a provider except the three
# mutually-exclusive runner steps at the bottom, which are selected by the repo
# variable AGENT_RUNNER (claude | codex | custom).

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  agent:
    # FAIL CLOSED. `vars.AGENT_RUNNER` is set by the installer as its LAST step,
    # after the token secret exists. Until then it is '' and this job never
    # starts: an `@agent` comment on an unconfigured repo is silently ignored,
    # with no red X on the issue. (`secrets` is not available in any `if:`,
    # job-level or step-level, so the gate has to be a variable.)
    #
    # The author-association guard is the second gate: every run spends a
    # human's model subscription, so an outside drive-by must not start one.
    # The || chain picks whichever actor field this event carries
    # (comment -> review -> issue); missing objects evaluate to null.
    if: |
      vars.AGENT_RUNNER != '' &&
      contains(fromJSON('["OWNER","COLLABORATOR","MEMBER"]'),
               github.event.comment.author_association ||
               github.event.review.author_association ||
               github.event.issue.author_association) && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@agent')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@agent')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@agent')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@agent') || contains(github.event.issue.title, '@agent')))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write        # push the working branch
      pull-requests: write   # open the PR instead of handing back a compare link
      issues: write          # comment when the run cannot proceed
      actions: read          # read CI results on PRs

    env:
      # gh auth for every runner, so `gh pr create` works on all three paths.
      # Note: a PR opened with GITHUB_TOKEN does not trigger further workflows.
      GH_TOKEN: ${{ github.token }}

      # The model credential, whatever the provider. One line, one name — the
      # runner steps below all read env.AGENT_TOKEN.
      # Solo repo: leave this expression exactly as generated. Do NOT flatten it
      # to a bare `${{ secrets.AGENT_TOKEN }}` — scripts/agent_billing.py parses
      # the actor clauses back out of this line, and a flattened line would drop
      # the owner on the next `add`.
      # >>> agent-billing: generated by scripts/agent_billing.py — do not hand-edit >>>
      AGENT_TOKEN: ${{ github.actor == '__OWNER_LOGIN__' && secrets.AGENT_TOKEN || '' }}
      # <<< agent-billing <<<

      # DELETE with the services: block below if tests need no database.
      DATABASE_URL: __DATABASE_URL__

    # --- DELETE this services: block if tests need no database (and the
    #     DATABASE_URL line above with it) ---
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: __DB_USER__
          POSTGRES_PASSWORD: __DB_PASSWORD__
          POSTGRES_DB: __DB_NAME__
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    # --- end optional block ---

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Second fail-closed gate. AGENT_RUNNER is set but the secret is missing
      # or is not billed to this actor: say so on the ticket instead of dying
      # inside the provider action with a cryptic auth error.
      - name: Check the agent is configured
        env:
          TICKET: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          if [ -z "$AGENT_TOKEN" ]; then
            gh issue comment "$TICKET" --body \
              "No model token is billed to \`${{ github.actor }}\`. Run \`scripts/agent_billing.py add ${{ github.actor }}\`, or set the \`AGENT_TOKEN\` secret."
            exit 1
          fi
          case "${{ vars.AGENT_RUNNER }}" in
            claude|codex|custom) ;;
            *) echo "AGENT_RUNNER must be claude, codex or custom"; exit 1 ;;
          esac

      - name: Configure git identity
        run: |
          git config user.name  "agent[bot]"
          git config user.email "agent[bot]@users.noreply.github.com"

      # __SETUP_STEPS__
      # Replace with this repo's install steps. Install only what an agent turn
      # needs — this runs on EVERY @agent comment, so pulling a GB of optional
      # deps costs minutes per turn. Heavy suites belong in the per-PR CI workflow.
      #
      # Python (uv):     uses: astral-sh/setup-uv@v5  ->  run: uv sync
      # Node:            uses: actions/setup-node@v4  ->  run: npm ci
      # Go:              uses: actions/setup-go@v5

      # The prompt is provider-neutral and injection-free: it carries only the
      # ticket NUMBER, never the ticket text. The agent reads the body itself
      # with gh, so nothing a commenter writes is ever interpolated into YAML.
      - name: Build the prompt
        env:
          TICKET: ${{ github.event.issue.number || github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          {
            echo 'AGENT_PROMPT<<PROMPT_EOF'
            echo "You are a background agent working in the GitHub repository $REPO."
            echo "Your ticket is #$TICKET."
            echo ""
            echo "1. Read it in full, including every comment:"
            echo "     gh issue view $TICKET --comments"
            echo "   (use 'gh pr view $TICKET --comments' if that ticket is a pull request)"
            echo "2. Do the work the ticket asks for."
            echo "3. Follow the 'Opening a PR (background agents)' section of CLAUDE.md"
            echo "   exactly. Opening the PR is your last action, not a compare link."
            echo ""
            echo "gh is already authenticated. Never push to the default branch."
            echo PROMPT_EOF
          } >> "$GITHUB_ENV"

      # --- runner: exactly one of the three below runs ---------------------

      - name: Run agent (Claude Code)
        if: vars.AGENT_RUNNER == 'claude'
        uses: anthropics/claude-code-action@v1
        with:
          prompt: ${{ env.AGENT_PROMPT }}
          claude_code_oauth_token: ${{ env.AGENT_TOKEN }}
          additional_permissions: |
            actions: read
          # Without Bash the agent gets git and nothing else: the package
          # manager, test runner and docker all come back "requires approval",
          # so it cannot run a single acceptance-criteria command. The runner is
          # ephemeral and the token is scoped to this repo, so this is the right
          # trade.
          claude_args: '--allowedTools "Bash,Read,Edit,Write,Glob,Grep"'

      - name: Run agent (OpenAI Codex)
        if: vars.AGENT_RUNNER == 'codex'
        uses: openai/codex-action@v1
        with:
          prompt: ${{ env.AGENT_PROMPT }}
          openai-api-key: ${{ env.AGENT_TOKEN }}
          # Needs network + write: it has to install deps, run tests and push.
          sandbox: danger-full-access

      # Anything else: Gemini CLI, aider, opencode, a local Ollama endpoint, or
      # Claude Code pointed at an OpenAI-compatible gateway. Set the repo
      # variable AGENT_COMMAND to the invocation; $AGENT_PROMPT and $AGENT_TOKEN
      # are in the environment. Install the CLI in the setup steps above.
      #
      #   npx @google/gemini-cli -p "$AGENT_PROMPT" --yolo
      #   uvx aider --message "$AGENT_PROMPT" --yes
      #   npx @anthropic-ai/claude-code -p "$AGENT_PROMPT" --allowedTools "Bash,Read,Edit,Write,Glob,Grep"
      - name: Run agent (custom)
        if: vars.AGENT_RUNNER == 'custom'
        run: ${{ vars.AGENT_COMMAND }}
