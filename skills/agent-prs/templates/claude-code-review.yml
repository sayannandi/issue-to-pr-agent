name: Claude Code Review

# Comment-triggered, NOT `pull_request`. A `pull_request` run executes the
# workflow file as it exists on the PR branch, so any collaborator with write
# access could open a same-repo PR that edits this file and exfiltrates a
# secret. `issue_comment` always runs the copy on the default branch, so a
# branch edit changes nothing. Cost: reviews are no longer automatic — comment
# `@claude-review` on the PR. (Branch protection on .github/workflows/ would be
# the other fix; it is GitHub Pro-only on private repos.)
on:
  issue_comment:
    types: [created]

jobs:
  claude-review:
    # Must be a PR (not a plain issue), must say @claude-review, and must come
    # from someone with repo access — every run bills a human's subscription.
    if: |
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '@claude-review') &&
      contains(fromJSON('["OWNER","COLLABORATOR","MEMBER"]'), github.event.comment.author_association)

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          # >>> claude-billing: generated by scripts/claude_billing.py — do not hand-edit >>>
          claude_code_oauth_token: ${{ github.actor == '__OWNER_LOGIN__' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          # <<< claude-billing <<<
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.issue.number }}'
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
