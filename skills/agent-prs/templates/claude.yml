name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Every run is billed to a human's Claude subscription, so only people with
    # repo access may start one — an outside drive-by `@claude` must not spend
    # our usage. The || chain picks whichever actor field this event carries
    # (comment → review → issue); missing objects evaluate to null.
    if: |
      contains(fromJSON('["OWNER","COLLABORATOR","MEMBER"]'),
               github.event.comment.author_association ||
               github.event.review.author_association ||
               github.event.issue.author_association) && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write        # push the working branch
      pull-requests: write   # open the PR instead of handing back a compare link
      issues: read
      id-token: write
      actions: read          # read CI results on PRs

    # --- DELETE this whole services:/env: block if tests need no database ---
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: __DB_USER__
          POSTGRES_PASSWORD: __DB_PASSWORD__
          POSTGRES_DB: __DB_NAME__
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: __DATABASE_URL__
    # --- end optional block ---

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # __SETUP_STEPS__
      # Replace with this repo's install steps. Install only what an agent turn
      # needs — this runs on EVERY @claude comment, so pulling a GB of optional
      # deps costs minutes per turn. Heavy suites belong in the per-PR CI workflow.
      #
      # Python (uv):     uses: astral-sh/setup-uv@v5  →  run: uv sync
      # Node:            uses: actions/setup-node@v4  →  run: npm ci
      # Go:              uses: actions/setup-go@v5

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          # Solo repo: replace this whole expression with
          #   ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Multiple collaborators: keep it and manage it with
          #   scripts/claude_billing.py add <login>
          # so each person's turns bill their own subscription.
          # >>> claude-billing: generated by scripts/claude_billing.py — do not hand-edit >>>
          claude_code_oauth_token: ${{ github.actor == '__OWNER_LOGIN__' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          # <<< claude-billing <<<

          additional_permissions: |
            actions: read

          # Without Bash the agent gets git and nothing else: the package
          # manager, test runner and docker all come back "requires approval",
          # so it cannot run a single acceptance-criteria command. The runner is
          # ephemeral and the token is scoped to this repo, so this is the right
          # trade.
          claude_args: '--allowedTools "Bash,Read,Edit,Write,Glob,Grep"'
